[build-system]
requires = ['setuptools>=61.0', 'setuptools-git-versioning<2']
build-backend = 'setuptools.build_meta'

[project]
name = 'template'
readme = 'README.md'
requires-python = '>=3.13'
license = 'LicenseRef-Proprietary'
license-files = ['LICENSE']
authors = [{name = 'Pipin Fitriadi', email = 'pipinfitriadi@gmail.com'}]
maintainers = [{name = 'Pipin Fitriadi', email = 'pipinfitriadi@gmail.com'}]
classifiers = [
    'Development Status :: 2 - Pre-Alpha',
    'Intended Audience :: Developers',
    'Intended Audience :: Information Technology',
    'Natural Language :: English',
    'Natural Language :: Indonesian',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3.13',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Utilities',
]
dynamic = ['version']

[dependency-groups]
code-coverage = [
    'coverage',
    'pytest',
    'pytest-asyncio',
    'toml',
]
code-quality = [
    'ruff',
]
notebook = [
    'ipykernel',
    'duckdb',
    'magic_duckdb',
]
dev = [
    'build',
    'git-filter-repo',
    {include-group = 'code-coverage'},
    {include-group = 'code-quality'},
    {include-group = 'notebook'},
]

[project.urls]
Repository = 'https://github.com/pipinfitriadi/python.git'

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = 'function'

[tool.ruff.lint]
select = ['ALL']
ignore = [
    'C408',
    'COM812',
    'D100',
    'D101',
    'D102',
    'D103',
    'D104',
    'D105',
    'D107',
    'D203',
    'D212',
    'EXE001',
    'FA100',
    'UP',
    'TID252',
]

[tool.ruff.lint.flake8-copyright]
notice-rgx = "(?i)Copyright \\(C\\)"

[tool.ruff.lint.per-file-ignores]
'tests/*.py' = ['S101']
'*.ipynb' = ['CPY001']

[tool.setuptools-git-versioning]
enabled = true
template = '{tag}'
dev_template = '{tag}'
dirty_template = '{tag}'
tag_filter = '^\d+\.\d+\.\d+(-[a-zA-Z0-9]+(\.[a-zA-Z0-9]+)*)?(\+[a-zA-Z0-9]+(\.[a-zA-Z0-9]+)*)?$'
